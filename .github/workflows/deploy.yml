name: CI/CD Frontend Vite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      
    env:
      VITE_API_URL: http://127.0.0.1:4000
      VITE_PEXELS_API_KEY: ${{ secrets.VERCEL_PEXELS_API_KEY }}

    steps:
      - name: Checkout Frontend repository code
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Install Frontend dependencies
        run: npm ci

      - name: Install Playwright multi-browsers
        run: npx playwright install --with-deps

      # 🚀 STEP C: Clone and execute your Express Backend directly inside the workflow shell
      # The trailing '&' launches the command as a detached background worker process!
      - name: Clone and run Express Backend companion server
        run: |
          git clone https://${{ secrets.BACKEND_TOKEN }}@://github.com backend-server
          cd backend-server
          
          echo "📦 Installing backend dependencies..."
          npm ci
          
          # 🚀 THE COMPILATION FIX: Compile TypeScript into the 'dist' folder before booting
          echo "🏗️ Building backend TypeScript source code..."
          npm run build
          
          echo "🚀 Launching companion backend server in the background..."
          NODE_ENV=production PORT=4000 MONGO_URI="${{ secrets.MONGO_URI }}" ACCESS_TOKEN_SECRET="${{ secrets.ACCESS_TOKEN_SECRET }}" REFRESH_TOKEN_SECRET="${{ secrets.REFRESH_TOKEN_SECRET }}" npm start &
          
          echo "⏳ Waiting for local backend server loop to bind on port 4000..."
          npx wait-on http://127.0.0 --timeout 30000
          echo "✅ Local Companion Backend is active and connected to MongoDB!"

      - name: Build Vite application for E2E testing
        run: npm run build

      - name: Run Playwright cross-browser tests (Chromium, Firefox, WebKit)
        run: npm run test:e2e
        env:
          CI: true 

      - name: Upload Playwright matrix report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # ----------------------------------------------------
      # DEPLOYMENT PHASE (Only triggers on push to main branch)
      # ----------------------------------------------------
      - name: Verify Vercel deployment credentials presence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "❌ Error: One or more Vercel deployment secrets are missing."
            exit 1
          fi
          echo "✅ Vercel configuration keys found in GitHub."

      - name: Install Vercel CLI globally
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment configurations
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "🔄 Validating credentials and pulling environment from Vercel..."
          if ! vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}; then
            echo "❌ Error: Vercel authentication failed!"
            exit 1
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build production artifacts for Vercel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: https://two026-blog-app-backend.onrender.com # Production URL for Vercel users

      - name: Deploy prebuilt artifacts to Vercel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
