name: CI/CD Frontend Vite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 🚀 CRITICAL: Compile the Vite app before running Playwright tests
      - name: Build Vite application for E2E testing
        run: npm run build
        env:
          VITE_API_URL: https://onrender.com

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: true 

      # Automatically saves snapshots and logs if tests fail
      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # ----------------------------------------------------
      # DEPLOYMENT PHASE (Only triggers on push to main branch)
      # ----------------------------------------------------
      - name: Verify Vercel deployment credentials presence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "❌ Error: One or more Vercel deployment secrets are missing from GitHub Repository Secrets."
            exit 1
          fi
          echo "✅ Vercel configuration keys found in GitHub."

      - name: Install Vercel CLI globally
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment configurations
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "🔄 Validating credentials and pulling environment from Vercel..."
          if ! vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}; then
            echo "❌ Error: Vercel authentication failed! Check your token/project IDs."
            exit 1
          fi
          echo "✅ Vercel credentials validated successfully."
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build production artifacts for Vercel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifacts to Vercel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
