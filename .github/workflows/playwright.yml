name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Warm up backend
        run: |
          echo "Warming up backend..."
          curl -fsS --max-time 10 https://two026-blog-app-backend.onrender.com/api/health || true

      - name: Build frontend
        env:
          VITE_API_URL: https://two026-blog-app-backend.onrender.com
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start preview server
        env:
          PORT: 3000
          VITE_API_URL: https://two026-blog-app-backend.onrender.com
        run: npm run preview &

      - name: Wait for preview
        run: npx wait-on http://127.0.0.1:3000

      - name: Run Playwright tests
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report